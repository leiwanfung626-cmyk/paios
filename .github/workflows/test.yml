name: Test

on:
  push:
    branches: [portable-master]
  pull_request:
    branches: [portable-master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml mcp

      - name: Build relationship graph
        run: |
          cd Core
          python 40_AUTOMATION/05_SCRIPTS/relationship_engine.py build

      - name: Test relationship engine
        run: |
          cd Core
          python 40_AUTOMATION/05_SCRIPTS/test_relationship_engine.py

      - name: Test usage tracker
        run: |
          cd Core
          python 40_AUTOMATION/05_SCRIPTS/test_usage_tracker.py

      - name: Verify MCP server starts
        run: |
          cd Core
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' | timeout 5 python 40_AUTOMATION/05_SCRIPTS/paios_mcp_server.py | head -1
