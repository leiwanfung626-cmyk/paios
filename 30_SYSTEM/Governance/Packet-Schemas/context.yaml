# Context Packet Schema
# AI 自动生成，用于任务在引擎间流转时携带上下文

context:
  type: object
  required: [version, task_id, from, to, background, current_state]
  fields:
    version:
      type: string
      default: "1.0"
      description: "Schema 版本号，支持向后演进"
    task_id:
      type: string
      description: "关联 Task ID"
    from:
      type: string
      description: "当前引擎"
    to:
      type: string
      description: "下一个引擎"
    background:
      type: text
      description: "任务背景——一句话说清前因"
    current_state:
      type: string
      enum: [discussion, proposal, development, review, audit, completed]
      description: "当前进展到哪一步"
    decision:
      type: text
      description: "已经做过的关键决策（可选）"
    open_question:
      type: text
      description: "尚待解决的问题（可选）"
    expected_output:
      type: text
      description: "期望下一个引擎产出什么"
