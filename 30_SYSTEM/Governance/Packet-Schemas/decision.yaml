# Decision Packet Schema
# AI 自动生成，用于记录讨论结论和取舍

decision:
  type: object
  required: [topic, conclusion, reason, impact]
  fields:
    topic:
      type: string
      description: "讨论主题"
    conclusion:
      type: text
      description: "最终决定是什么"
    reason:
      type: text
      description: "为什么这样决定"
    rejected:
      type: list
      items:
        type: object
        fields:
          option: string
          reason: string
      description: "被放弃的方案及原因"
    impact:
      type: list
      items: string
      description: "影响哪些模块/文档"
    need_review:
      type: boolean
      default: true
      description: "是否需要 Review"
    deadline:
      type: string
      pattern: "\\d{4}-\\d{2}-\\d{2}"
      description: "截止日期（可选）"
